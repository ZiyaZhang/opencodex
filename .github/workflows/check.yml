name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/fixtures/output-qa/home.test.mjs
      - run: node --check tests/fixtures/output-qa/index.mjs && node --check tests/fixtures/output-qa/control.mjs && node --check tests/fixtures/output-qa/init.mjs
      - run: npm pack --dry-run
      - run: npm ci && npm test && npm run package
        working-directory: examples/async-questions
