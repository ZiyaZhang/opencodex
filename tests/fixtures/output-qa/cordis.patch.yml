- id: agent-default-model
  config:
    provider: output-qa-local
    model: deterministic-ui-fixture
- id: session-title-llm
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- insert:
    - id: output-qa-fixture
      name: __FIXTURE_MODULE__
    - id: preset-output-qa-ordinary
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: output-qa-ordinary
        name: QA ordinary questions
        order: 100
        plugins:
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: legacy
    - id: preset-output-qa-timed
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: output-qa-timed
        name: QA timed questions
        order: 101
        plugins:
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: 5
